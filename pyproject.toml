[project]
name = "oncorag"
version = "0.1.0"
description = "Production RAG + agentic oncology knowledge system built on Weaviate"
requires-python = ">=3.11"
dependencies = [
    "weaviate-client>=4.9,<5",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "sentence-transformers>=3.0",
    "anthropic>=0.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
